<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biplab Saud — Video Editor & Motion Designer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #0D0D0D;
      --text: #D9D9D9;
      --accent: #8C1111;
    }

    /* Neue Montreal is a paid font (Pangram Pangram). We approximate it with a
     clean geometric sans stack until the real font files are licensed/added. */
    @font-face {
      font-family: 'Neue Montreal';
      src: local('Neue Montreal');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: linear-gradient(180deg, #0D0D0D 0%, #0D0D0D 35%, #2b0a0a 70%, #4a0d0d 100%);
      color: var(--text);
      font-family: 'Neue Montreal', 'Inter', 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ---------- NAV ---------- */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 64px;
    }

    .nav-group {
      display: flex;
      gap: 40px;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1.5px;
      font-size: 15px;
      opacity: 0.85;
      transition: opacity 0.25s ease, color 0.25s ease;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0%;
      height: 1px;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    nav a:hover {
      opacity: 1;
      color: #fff;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* ---------- HERO ---------- */
    header.hero {
      text-align: center;
      padding: 40px 20px 0;
    }

    h1.name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(56px, 10vw, 108px);
      letter-spacing: 4px;
      color: var(--text);
      line-height: 1;
      text-transform: uppercase;
    }

    p.role {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: clamp(16px, 2vw, 20px);
      letter-spacing: 1px;
      color: var(--text);
      margin-top: 14px;
      opacity: 0.9;
    }

    /* ---------- VIDEO FRAME ---------- */
    .video-wrap {
      max-width: 1006px;
      margin: 48px auto 0;
      padding: 0 20px;
    }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9.6;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 30px 80px -20px rgba(140, 17, 17, 0.35);
    }

    .video-frame video,
    .video-frame img,
    .video-frame iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border: none;
    }

    .video-frame .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      background:
        repeating-linear-gradient(45deg, #f5f5f5 0 10px, #ffffff 10px 20px);
    }

    /* ---------- DESCRIPTION ---------- */
    .description {
      max-width: 760px;
      margin: 56px auto 0;
      text-align: center;
      padding: 0 24px 100px;
    }

    .description p {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: clamp(16px, 2.1vw, 21px);
      line-height: 1.6;
      color: var(--text);
    }

    .description p .drop {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5em;
      color: var(--accent);
      -webkit-text-stroke: 0.3px var(--accent);
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 640px) {
      nav {
        padding: 24px 24px;
      }

      .nav-group {
        gap: 20px;
      }

      nav a {
        font-size: 13px;
      }

      .video-wrap {
        margin-top: 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-group">
      <a href="#tools">TOOLS</a>
      <a href="#about">ABOUT</a>
    </div>
    <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
      <img src="/logo.svg" alt="Biplab Logo" style="height: 36px; width: auto;" />
      <span
        style="font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; color: var(--text);">BIPLAB</span>
    </a>
    <div class="nav-group">
      <a href="#works">WORKS</a>
      <a href="#contact">CONTACT</a>
    </div>
  </nav>

  <header class="hero">
    <h1 class="name">Biplab Saud</h1>
    <p class="role">Video Editor &amp; Motion Designer</p>
  </header>

  <div class="video-wrap">
    <div class="video-frame">
      <!--
      Swap the placeholder below for a real video/image, e.g.:
      <video autoplay muted loop playsinline>
        <source src="your-reel.mp4" type="video/mp4">
      </video>
      or
      <img src="your-cover.jpg" alt="Reel cover">
    -->
      <div class="placeholder">SHOWREEL / VIDEO GOES HERE</div>
    </div>
  </div>

  <div class="description">
    <p><span class="drop">S</span>pecialized motion design and video editing that brings deep analytical commentary,
      geopolitics, and complex narratives to life.</p>
  </div>

</body>

</html>
